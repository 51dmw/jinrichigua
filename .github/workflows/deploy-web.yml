name: Deploy Web (Cloudflare Workers)

# 部署前台到 Cloudflare Workers（OpenNext，§7）。
# 需在仓库 Secrets 配置：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
#
# 只允许手动触发：线上前台实际跑在 VPS 的 PM2 上（发版走 scripts/deploy-web.sh），
# 这套 Workers 部署是未验证的遗留，不应该每次推 main 都自动跑。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build

      - name: Deploy via OpenNext
        run: pnpm --filter web deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
